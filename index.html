<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="상해">
<title>Shanghai 4Days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&icon_names=apps,badge,calendar_month,castle,checkroom,chevron_right,confirmation_number,directions_subway,directions_walk,emoji_food_beverage,expand_more,flight,hotel,icecream,info,local_bar,local_taxi,location_on,luggage,map,my_location,open_in_new,partly_cloudy_day,payments,photo_camera,photo_library,power,ramen_dining,receipt_long,refresh,restaurant,search,shopping_bag,sos,star,translate,view_agenda,villa,volume_up,waving_hand,wifi,zoom_out_map&display=block">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <span class="navbar-title" id="navbarTitle">Shanghai 4Days</span>
    <button class="refresh" id="refreshBtn" aria-label="새로고침"><span class="ms" aria-hidden="true">refresh</span></button>
  </div>
</header>

<main id="app">
  <section class="screen" id="screen-plan" data-title="Shanghai 4Days" aria-label="일정"></section>
  <section class="screen" id="screen-places" data-title="Places" aria-label="장소" hidden></section>
  <section class="screen" id="screen-info" data-title="Info" aria-label="여행 정보" hidden></section>
  <section class="screen" id="screen-talk" data-title="Phrases" aria-label="기초 중국어" hidden></section>
</main>

<nav class="tabbar" aria-label="탭">
  <button class="tab is-active" data-tab="plan" aria-current="page">
    <span class="ms" aria-hidden="true">calendar_month</span>
    <span>일정</span>
  </button>
  <button class="tab" data-tab="places">
    <span class="ms" aria-hidden="true">location_on</span>
    <span>장소</span>
  </button>
  <button class="tab" data-tab="info">
    <span class="ms" aria-hidden="true">info</span>
    <span>정보</span>
  </button>
  <button class="tab" data-tab="talk">
    <span class="ms" aria-hidden="true">translate</span>
    <span>회화</span>
  </button>
</nav>

<div class="sheet" id="showSheet" role="dialog" aria-modal="true" aria-label="크게 보여주기" hidden>
  <div class="sheet-body">
    <p class="show-ko" id="showKo"></p>
    <p class="show-zh" id="showZh" lang="zh-CN"></p>
    <p class="show-py" id="showPy"></p>
    <div class="sheet-actions">
      <button class="pill pill-tint" id="showSpeak">들려주기</button>
      <button class="pill" id="showClose">닫기</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="maps.js"></script>
<script src="app.js"></script>
</body>
</html>
