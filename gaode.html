<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고덕지도 빠른 저장</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding-bottom: 40px; }
  main { padding-top: calc(12px + env(safe-area-inset-top)); }
  .back { display: inline-block; margin: 0 4px 6px; font-size: 17px; }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin: 4px 0; font-size: 15px; }
  .row .done { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); margin-top: 3px; display: grid; place-items: center; }
  .row.is-done .done { background: var(--stay); border-color: var(--stay); }
  .row.is-done .done::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .row.is-done .row-title { color: var(--label2); }
  .copy { flex: none; font-size: 13px; color: var(--blue); font-weight: 600; padding: 6px 2px 6px 8px; margin-top: 2px; }
  .progress { font-size: 15px; color: var(--label2); margin: 0 4px 10px; }
</style>
</head>
<body>
<main class="screen">
  <a class="back" href="./">‹ 일정</a>
  <h1 class="large-title">고덕지도 빠른 저장</h1>
  <div class="list" style="padding:12px 16px">
    <ol class="steps">
      <li>고덕 앱에서 즐겨찾기 폴더 <b>상해여행</b>을 먼저 만들어 두세요.</li>
      <li>아래 장소를 누르면 고덕 앱이 그 장소를 검색해요.</li>
      <li>맞는 지점을 골라 ☆(收藏)를 누르고 이 화면으로 돌아오세요.</li>
      <li>누른 곳은 자동으로 체크돼요. 검색이 안 되면 <b>검색어</b>를 복사해 고덕 검색창에 붙여넣으세요.</li>
      <li>고덕 앱 즐겨찾기 장소의 备注(메모) 칸에 <b>메모</b>를 복사해 붙여넣으면 설명이 남아요. 고덕 웹에는 메모 칸이 없어요.</li>
    </ol>
  </div>
  <p class="progress" id="progress" style="margin-top:18px"></p>
  <div class="seg" role="group" aria-label="필터"><button data-f="planned" aria-pressed="true">일정 장소</button><button data-f="backup" aria-pressed="false">후보</button><button data-f="all" aria-pressed="false">전체</button></div>
  <div id="list"></div>
</main>
<script src="data.js"></script>
<script>
(() => {
  const { PLACES } = window.TRIP_DATA;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const get = () => { try { return JSON.parse(localStorage.getItem('sh26:gaode') || '{}'); } catch { return {}; } };
  const put = (v) => { try { localStorage.setItem('sh26:gaode', JSON.stringify(v)); } catch {} };
  const url = (p) => p.lng && p.lat
    ? `https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.cn)}&src=sh26trip&coordinate=gaode&callnative=1`
    : `https://uri.amap.com/search?keyword=${encodeURIComponent(p.q || p.cn)}&city=310000&src=sh26trip&callnative=1`;
  const CAT = { food: '식당', dessert: '디저트', tea: '차', shop: '숍', sight: '명소', architecture: '건축', street: '거리', bar: '바', stay: '숙소', move: '이동' };
  // 고덕 즐겨찾기 메모(备注)에 붙여넣을 한 줄 설명
  const memo = (p) => [p.name, CAT[p.cat], p.status === 'planned' ? '일정' : '후보', p.hours, p.memo].filter(Boolean).join(' · ');
  let f = 'planned';
  function render() {
    const done = get();
    const items = Object.entries(PLACES).filter(([, p]) => f === 'all' || p.status === f);
    const n = items.filter(([k]) => done[k]).length;
    document.getElementById('progress').textContent = `${items.length}곳 중 ${n}곳 열어봄`;
    document.getElementById('list').innerHTML = `<div class="list">${items.map(([k, p]) => `
      <div class="row${done[k] ? ' is-done' : ''}" style="--inset:52px">
        <span class="done" aria-hidden="true"></span>
        <a class="row-main" href="${url(p)}" target="_blank" rel="noopener" data-k="${k}" style="color:inherit">
          <span class="row-title" style="display:block">${esc(p.name)}</span>
          <span class="row-zh" lang="zh-CN" style="display:block">${esc(p.q || p.cn)}</span>
          ${p.addr ? `<span class="row-note" lang="zh-CN" style="display:block">${esc(p.addr)}</span>` : ''}
        </a>
        <span style="display:flex;flex-direction:column;align-items:flex-end">
          <button class="copy" data-copy="${esc(p.q || p.cn)}" data-label="검색어">검색어</button>
          <button class="copy" data-copy="${esc(memo(p))}" data-label="메모">메모</button>
        </span>
      </div>`).join('')}</div>`;
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-k]');
    if (a) { const d = get(); d[a.dataset.k] = true; put(d); setTimeout(render, 300); return; }
    const c = e.target.closest('[data-copy]');
    if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => { c.textContent = '복사됨'; setTimeout(() => (c.textContent = c.dataset.label), 1500); }); return; }
    const s = e.target.closest('[data-f]');
    if (s) { f = s.dataset.f; document.querySelectorAll('[data-f]').forEach((b) => b.setAttribute('aria-pressed', String(b === s))); render(); }
  });
  render();
})();
</script>
</body>
</html>
